<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-labelledby="t d"><title id="t">Packet switching routes</title><desc id="d">Sender S and receiver R connected through routers A, B, C and D with multiple possible paths.</desc><rect width="640" height="300" fill="#f7fbff"/><g stroke="#8aa1bc" stroke-width="5" fill="none"><path d="M90 150L215 70L365 80L550 150"/><path d="M90 150L220 230L390 220L550 150"/><path d="M215 70L220 230M365 80L390 220M215 70L390 220"/></g><g font-family="Arial" text-anchor="middle" font-weight="700"><g fill="#6558f5"><circle cx="70" cy="150" r="34"/><circle cx="570" cy="150" r="34"/></g><g fill="#0dae91"><circle cx="215" cy="70" r="27"/><circle cx="220" cy="230" r="27"/><circle cx="365" cy="80" r="27"/><circle cx="390" cy="220" r="27"/></g><g fill="#fff" font-size="18"><text x="70" y="157">S</text><text x="570" y="157">R</text><text x="215" y="77">A</text><text x="220" y="237">B</text><text x="365" y="87">C</text><text x="390" y="227">D</text></g></g><text x="320" y="286" text-anchor="middle" font-family="Arial" font-size="15" fill="#52627a">A packet-switched network</text></svg>
