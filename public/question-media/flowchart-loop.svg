<svg xmlns="http://www.w3.org/2000/svg" width="520" height="520" viewBox="0 0 520 520" role="img" aria-labelledby="t d"><title id="t">Counting-loop flowchart</title><desc id="d">Start, set Total to zero, input Number, add Number to Total, test whether Number equals zero, then output Total and stop.</desc><rect width="520" height="520" fill="#fbfaff"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#59657a"/></marker></defs><g stroke="#6558f5" stroke-width="3" fill="#fff" font-family="Arial" text-anchor="middle"><ellipse cx="260" cy="45" rx="70" ry="28"/><rect x="175" y="95" width="170" height="52"/><path d="M155 175H365L335 230H125Z"/><rect x="165" y="260" width="190" height="52"/><path d="M260 340L355 395L260 450L165 395Z"/><path d="M155 470H365L335 510H125Z"/></g><g font-family="Arial" text-anchor="middle" font-size="15"><text x="260" y="51">START</text><text x="260" y="126">Total ← 0</text><text x="245" y="207">INPUT Number</text><text x="260" y="291">Total ← Total + Number</text><text x="260" y="390">Number = 0?</text><text x="260" y="413"> </text><text x="245" y="496">OUTPUT Total</text><text x="375" y="388">Yes</text><text x="145" y="388">No</text></g><g stroke="#59657a" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M260 73V91M260 147V171M260 230V256M260 312V337M355 395H405V490H365"/><path d="M165 395H80V202H125"/></g></svg>
