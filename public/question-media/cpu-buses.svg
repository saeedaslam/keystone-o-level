<svg xmlns="http://www.w3.org/2000/svg" width="680" height="340" viewBox="0 0 680 340" role="img" aria-labelledby="t d"><title id="t">CPU, memory and buses</title><desc id="d">CPU containing control unit, ALU, accumulator, program counter, memory address register and memory data register, linked to memory by address, data and control buses.</desc><rect width="680" height="340" fill="#fffaf6"/><rect x="35" y="45" width="350" height="245" rx="18" fill="#fff" stroke="#ff8a55" stroke-width="4"/><text x="210" y="78" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700">CPU</text><g font-family="Arial" font-size="15" text-anchor="middle"><rect x="65" y="105" width="120" height="55" rx="8" fill="#6558f5"/><rect x="220" y="105" width="130" height="55" rx="8" fill="#0dae91"/><rect x="65" y="190" width="75" height="50" rx="8" fill="#2d8cff"/><rect x="150" y="190" width="75" height="50" rx="8" fill="#2d8cff"/><rect x="235" y="190" width="55" height="50" rx="8" fill="#2d8cff"/><rect x="300" y="190" width="55" height="50" rx="8" fill="#2d8cff"/><g fill="#fff"><text x="125" y="137">Control unit</text><text x="285" y="137">ALU</text><text x="102" y="221">ACC</text><text x="187" y="221">PC</text><text x="262" y="221">MAR</text><text x="327" y="221">MDR</text></g></g><rect x="535" y="110" width="110" height="120" rx="12" fill="#fff" stroke="#6558f5" stroke-width="4"/><text x="590" y="175" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">Memory</text><g stroke-width="5"><path d="M385 125H535" stroke="#eb5b72"/><path d="M385 170H535" stroke="#2d8cff"/><path d="M385 215H535" stroke="#0dae91"/></g><g font-family="Arial" font-size="12"><text x="460" y="117" text-anchor="middle">control bus</text><text x="460" y="162" text-anchor="middle">address bus</text><text x="460" y="207" text-anchor="middle">data bus</text></g></svg>
