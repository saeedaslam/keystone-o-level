<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" role="img" aria-labelledby="t d"><title id="t">Logic circuit</title><desc id="d">Inputs A and B enter an AND gate. Input C enters a NOT gate. The two intermediate outputs enter an OR gate to produce Q.</desc><rect width="680" height="300" fill="#fbfaff"/><g stroke="#17213b" stroke-width="4" fill="none"><path d="M45 85H170M45 145H170M260 115H440M45 225H175M245 225H365V170H440M550 145H635"/></g><g fill="#fff" stroke="#6558f5" stroke-width="4"><path d="M170 65H215A50 50 0 010 100H170Z" transform="translate(0 0)"/><path d="M175 195L235 225L175 255Z"/><circle cx="243" cy="225" r="8"/><path d="M440 95Q485 95 520 145Q485 195 440 195Q460 145 440 95Z"/></g><g font-family="Arial" font-size="18" font-weight="700"><text x="25" y="91">A</text><text x="25" y="151">B</text><text x="25" y="231">C</text><text x="645" y="151">Q</text><text x="190" y="122" fill="#6558f5">AND</text><text x="183" y="230" fill="#6558f5">NOT</text><text x="472" y="151" fill="#6558f5">OR</text></g></svg>
