<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-labelledby="t d"><title id="t">Two-dimensional array grid</title><desc id="d">A three by four array named Seats with row indexes 1 to 3 and column indexes 1 to 4. Values are A, B, C and D.</desc><rect width="640" height="300" fill="#f7fbff"/><text x="320" y="34" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700">Seats</text><g font-family="Arial" text-anchor="middle"><g fill="#6558f5" font-size="15"><text x="220" y="75">1</text><text x="300" y="75">2</text><text x="380" y="75">3</text><text x="460" y="75">4</text><text x="145" y="120">1</text><text x="145" y="180">2</text><text x="145" y="240">3</text></g><g fill="#fff" stroke="#2d8cff" stroke-width="3"><rect x="180" y="85" width="320" height="180"/><path d="M260 85V265M340 85V265M420 85V265M180 145H500M180 205H500"/></g><g fill="#17213b" font-size="20"><text x="220" y="122">A</text><text x="300" y="122">B</text><text x="380" y="122">C</text><text x="460" y="122">D</text><text x="220" y="182">E</text><text x="300" y="182">F</text><text x="380" y="182">G</text><text x="460" y="182">H</text><text x="220" y="242">I</text><text x="300" y="242">J</text><text x="380" y="242">K</text><text x="460" y="242">L</text></g></g></svg>
