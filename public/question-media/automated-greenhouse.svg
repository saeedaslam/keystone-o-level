<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" role="img" aria-labelledby="t d"><title id="t">Automated greenhouse control loop</title><desc id="d">Temperature sensor sends readings to a microprocessor, which compares them with a set point and controls a fan actuator. The greenhouse temperature provides feedback.</desc><rect width="680" height="300" fill="#f5fffb"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52627a"/></marker></defs><g font-family="Arial" text-anchor="middle"><rect x="35" y="105" width="135" height="70" rx="12" fill="#2d8cff"/><rect x="255" y="90" width="170" height="100" rx="12" fill="#6558f5"/><rect x="510" y="105" width="135" height="70" rx="12" fill="#ff8a55"/><g fill="#fff" font-size="16" font-weight="700"><text x="102" y="134">Temperature</text><text x="102" y="156">sensor</text><text x="340" y="125">Microprocessor</text><text x="340" y="151">compare with</text><text x="340" y="174">set point</text><text x="577" y="134">Fan</text><text x="577" y="156">actuator</text></g></g><g stroke="#52627a" stroke-width="4" fill="none" marker-end="url(#a)"><path d="M170 140H250"/><path d="M425 140H505"/><path d="M577 180V245H102V180"/></g><text x="340" y="270" text-anchor="middle" font-family="Arial" font-size="15" fill="#52627a">Feedback: changed greenhouse temperature</text></svg>
