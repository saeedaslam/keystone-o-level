<svg xmlns="http://www.w3.org/2000/svg" width="640" height="260" viewBox="0 0 640 260" role="img" aria-labelledby="t d"><title id="t">Eight-bit binary place-value grid</title><desc id="d">Eight columns labelled 128 to 1, with bits 0 1 0 1 1 0 1 0.</desc><rect width="640" height="260" fill="#f7f6ff"/><text x="320" y="34" text-anchor="middle" font-family="Arial" font-size="20" fill="#17213b">8-bit register</text><g font-family="Arial" text-anchor="middle"><g fill="#6558f5" font-size="16"><text x="75" y="82">128</text><text x="145" y="82">64</text><text x="215" y="82">32</text><text x="285" y="82">16</text><text x="355" y="82">8</text><text x="425" y="82">4</text><text x="495" y="82">2</text><text x="565" y="82">1</text></g><g fill="#fff" stroke="#6558f5" stroke-width="3"><rect x="43" y="105" width="64" height="70" rx="8"/><rect x="113" y="105" width="64" height="70" rx="8"/><rect x="183" y="105" width="64" height="70" rx="8"/><rect x="253" y="105" width="64" height="70" rx="8"/><rect x="323" y="105" width="64" height="70" rx="8"/><rect x="393" y="105" width="64" height="70" rx="8"/><rect x="463" y="105" width="64" height="70" rx="8"/><rect x="533" y="105" width="64" height="70" rx="8"/></g><g fill="#17213b" font-size="32" font-weight="700"><text x="75" y="151">0</text><text x="145" y="151">1</text><text x="215" y="151">0</text><text x="285" y="151">1</text><text x="355" y="151">1</text><text x="425" y="151">0</text><text x="495" y="151">1</text><text x="565" y="151">0</text></g></g><text x="320" y="220" text-anchor="middle" font-family="Arial" font-size="15" fill="#69738c">Most significant bit ← bit pattern → least significant bit</text></svg>
